appId: com.momo.office
productName: Momo Office
asar: true
electronVersion: 39.8.6
npmRebuild: false
buildDependenciesFromSource: false
directories:
  output: output
files:
  - desktop/credentials.cjs
  - desktop/main.cjs
  - desktop/preload.cjs
  - desktop/splash.html
  - desktop/splash.css
  - desktop/splash.js
  - desktop/splash-preload.cjs
  - packages/server/dist/**/*.js
  - packages/ui/dist/**
  - CREDITS.md
  - LICENSE
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
  icon: desktop/icon.ico
  signExecutable: false
  artifactName: Momo-Office-${version}-Setup.exe
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Momo Office
  uninstallDisplayName: Momo Office
  runAfterFinish: false
  deleteAppDataOnUninstall: false
  differentialPackage: false
  installerIcon: desktop/icon.ico
  uninstallerIcon: desktop/icon.ico
