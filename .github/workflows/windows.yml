name: Windows app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: node tests/desktop.cjs
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Momo-Office-Windows
          path: output/Momo-Office-*-Windows.exe
