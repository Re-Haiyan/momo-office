name: Windows app
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested Windows app
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
      - name: Save visual check screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Momo-Office-VisualChecks
          path: work/test-results/*.png
          retention-days: 7
      - run: node tests/desktop.cjs
      - run: node tests/startup-cancel.cjs
      - run: npm run dist:win
      - name: Test packaged desktop app
        run: node tests/desktop.cjs
        env:
          ELECTRON_EXECUTABLE: ${{ github.workspace }}\output\win-unpacked\Momo Office.exe
          MOMO_PACKAGED: "1"
      - name: Install and uninstall check
        run: ./tests/installer.ps1
      - name: Generate installer checksums
        shell: pwsh
        run: |
          $exe = Get-Item "output/Momo-Office-*-Setup.exe"
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content "output/$($exe.Name).sha256" -Encoding utf8
          "$hash  $($exe.Name)" | Set-Content output/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Momo-Office-Windows
          path: |
            output/Momo-Office-*-Setup.exe
            output/*.sha256
            output/SHA256SUMS.txt
  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Momo-Office-Windows
          path: output
      - name: Publish verified app
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'The release tag must match package.json version.' }
          $exe = Get-Item "output/Momo-Office-$version-Setup.exe"
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content output/SHA256SUMS.txt -Encoding utf8
          $notesFile = Join-Path $env:RUNNER_TEMP 'momo-release-notes.md'
          $notes = Get-Content .github/release-notes.md -Raw
          $notes += "`n`nWindows build, browser flows, engine tests, loading-screen handoff, desktop startup/shutdown, packaged-app launch, installation and uninstallation passed: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n"
          $notes | Set-Content $notesFile -Encoding utf8
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Momo Office $version - Windows" --notes-file $notesFile --draft
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release.' }
          } elseif (!(($existing | ConvertFrom-Json).isDraft)) {
            throw 'This version is already published. Bump the version instead of overwriting it.'
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Momo Office $version - Windows" --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { throw 'Could not update release notes.' }
          gh release upload $tag $exe.FullName "output/$($exe.Name).sha256" output/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload application assets.' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release.' }
